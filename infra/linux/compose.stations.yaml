services:
  station:
    build:
      context: ..
      dockerfile: infra/linux/Dockerfile.station
      args:
        SUITE_RELEASE_SHA: ${SUITE_RELEASE_SHA:-unknown}
    restart: unless-stopped
    environment:
      SUITE_WEB: /srv/station/web-dist
      SUITE_DB: /srv/station/data/stations.sqlite
      SUITE_ADDR: 0.0.0.0:8095
      INFRA_GATEWAY_URL: http://gateway:8080
      INFRA_GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN}
    volumes:
      - station-data:/srv/station/data
    healthcheck:
      test: ["CMD", "/srv/station/station-server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  station-data:
